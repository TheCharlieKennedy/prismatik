<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webgl-core dev</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 12px; padding: 16px; }
    #wrap { position: relative; width: min(800px, 100vw); aspect-ratio: 4/3; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    #hint { text-align: center; color: #666; font: 14px monospace; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <canvas id="overlay"></canvas>
  </div>
  <div id="hint">Drag — rotate &nbsp;|&nbsp; Click / tap — toggle icon &nbsp;|&nbsp; Escape — open menu</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
